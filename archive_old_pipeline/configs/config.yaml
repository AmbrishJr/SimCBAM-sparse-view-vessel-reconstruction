# Training / hyperparameters (Colab defaults, matching the original notebook).
# All paths can be overridden via env vars: DATA_ROOT, CKPT_ROOT.

data:
  root: "./data"                 # override with DATA_ROOT
  sparse_dirs:
    32: "Vessel_sparse32"
    64: "Vessel_sparse64"
    96: "Vessel_sparse96"
  gt_dir: "Vessel"

checkpoints:
  root: "./checkpoints"          # override with CKPT_ROOT

training:
  in_channels: 1
  out_channels: 1
  base_channels: 32
  epochs: 30                     # matches train_and_eval in the notebook
  batch_size: 8
  learning_rate: 0.001
  device: "auto"                 # "auto", "cuda", or "cpu"

classifier:
  epochs: 10                     # matches the notebook's classifier training
  batch_size: 32
  learning_rate: 0.001
  num_classes: 3
  sparsity_levels: [32, 64, 96]

evaluation:
  data_range: 1.0
  output_dir: "./outputs"